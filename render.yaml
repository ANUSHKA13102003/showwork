services:
  - type: web
    name: showwork
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: TRUST_PROXY
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
